[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bugledger-mcp"
version = "0.1.0"
description = "A local-first Model Context Protocol (MCP) server for tracking, searching, and preventing recurring software bugs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "xajeel" },
]
keywords = ["mcp", "bugs", "semgrep", "sqlite"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp>=3.4.7",
]

[project.scripts]
bugledger-mcp = "bugledger_mcp.mcp_server:main"

[dependency-groups]
test = [
    "pytest>=8",
]
rules = [
    "semgrep>=1.174.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bugledger_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
