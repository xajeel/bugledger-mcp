[project]
name = "bugledger-mcp"
version = "0.1.0"
description = "A local-first Model Context Protocol (MCP) server for tracking, searching, and preventing recurring software bugs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.7",
]

[dependency-groups]
test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
