rules:
  - id: bugledger-yaml-unsafe-load
    languages:
      - python
    severity: ERROR
    message: >
      Unsafe YAML loading can construct arbitrary Python objects and execute
      code. Use yaml.safe_load() or yaml.load(..., Loader=yaml.SafeLoader)
      for untrusted input.
    patterns:
      - pattern-inside: |
          import yaml
          ...
      - pattern-either:
          - pattern: yaml.load(...)
          - pattern: yaml.load_all(...)
          - pattern: yaml.load(..., Loader=yaml.Loader, ...)
          - pattern: yaml.load_all(..., Loader=yaml.Loader, ...)
          - pattern: yaml.load(..., Loader=yaml.UnsafeLoader, ...)
          - pattern: yaml.load_all(..., Loader=yaml.UnsafeLoader, ...)
          - pattern: yaml.unsafe_load(...)
          - pattern: yaml.unsafe_load_all(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load_all(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
      - pattern-not: yaml.load_all(..., Loader=yaml.CSafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.FullLoader, ...)
      - pattern-not: yaml.load_all(..., Loader=yaml.FullLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CFullLoader, ...)
      - pattern-not: yaml.load_all(..., Loader=yaml.CFullLoader, ...)
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      confidence: HIGH
      bugledger-stacks: [python]
