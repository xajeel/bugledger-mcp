rules:
  - id: bugledger-password-in-url
    languages:
      - python
      - javascript
      - typescript
      - java
      - go
      - ruby
      - rust
      - kotlin
      - csharp
      - php
      - scala
      - swift
    severity: ERROR
    message: >
      Password embedded in a connection string or URL. Use environment
      variables for credentials and build the connection string at runtime.
    patterns:
      - pattern-regex: '://[A-Za-z0-9_\-]+:[A-Za-z0-9_\-!@#$%^&*\.]{4,}@[A-Za-z0-9\.\-]+'
      # Placeholders (user:pass@host, ${PASSWORD}, %s) are documentation, not leaks.
      - pattern-not-regex: '://[A-Za-z0-9_\-]+:((pass|password|passwd|secret|x{3,}|\*+|\.\.\.)@|[\$\{%<])'
    metadata:
      category: security
      cwe: "CWE-259: Use of Hard-coded Password"
      confidence: MEDIUM
      bugledger-stacks: [all]
