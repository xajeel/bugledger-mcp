rules:
  - id: bugledger-password-in-url
    languages:
      - python
      - javascript
      - typescript
      - java
      - go
      - ruby
      - rust
      - kotlin
      - csharp
      - php
      - scala
      - swift
    severity: ERROR
    message: >
      Password embedded in a connection string or URL. Use environment
      variables for credentials and build the connection string at runtime.
    pattern-regex: '://[A-Za-z0-9_\-]+:[A-Za-z0-9_\-!@#$%^&*\.]{4,}@[A-Za-z0-9\.\-]+'
    metadata:
      category: security
      cwe: "CWE-259: Use of Hard-coded Password"
      confidence: MEDIUM
      bugledger-stacks: [all]
