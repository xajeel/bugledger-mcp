rules:
  - id: bugledger-cors-allow-all
    languages:
      - python
      - javascript
      - typescript
      - java
      - go
      - ruby
      - rust
      - kotlin
      - csharp
      - php
      - scala
      - swift
    severity: WARNING
    message: >
      CORS is configured to allow all origins. This lets any website
      make requests to your API from a browser. Restrict to trusted
      origins in production.
    pattern-regex: '(?i)((allow_origin[s]?|cors_origin[s]?|allowed_origin[s]?|\borigin)\s*[=:]\s*\[?\s*["'']\*["'']|Access-Control-Allow-Origin["'']?\s*[,=:]\s*["'']\*["'']|CORS_(ALLOW_ALL_ORIGINS|ORIGIN_ALLOW_ALL)\s*=\s*True)'
    metadata:
      category: security
      cwe: "CWE-942: Overly Permissive Cross-domain Whitelist"
      confidence: MEDIUM
      bugledger-stacks: [all]
