rules:
  - id: bugledger-hardcoded-secret
    languages:
      - python
      - javascript
      - typescript
      - java
      - go
      - ruby
      - rust
      - kotlin
      - csharp
      - php
      - scala
      - swift
    severity: ERROR
    message: >
      Hardcoded secret detected. Move secrets to environment variables
      or a secrets manager. Never commit credentials to source control.
    patterns:
      - pattern-regex: '(?i)(password|passwd|secret|api_key|api_secret|access_token|auth_token|private_key|client_secret)\s*[=:]\s*["''][A-Za-z0-9+/=_\-\.!@#$%^&*]{8,}["'']'
      # Obvious placeholders from docs and examples are not secrets.
      - pattern-not-regex: '(?i)["''](your[-_ ]|<|\.\.\.|x{4,}|change[-_ ]?me|placeholder|dummy|example|replace[-_ ]?me|sample|todo|redacted|\*{4,}|secret|password|my[-_]|abc123|iamsensitive)|\.\.\.["'']'
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: MEDIUM
      bugledger-stacks: [all]
